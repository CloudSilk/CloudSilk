syntax="proto3";

package proto;
option go_package = "./;proto";

import "mom_common.proto";
import "material_store.proto";
import "product_order.proto";

message WMSBillQueueInfo {
	//ID 
 	string id=1;
	//拣货单号 
 	string billNo=2;
	//任务单号 
    string taskNo=3;
	//物料仓库ID 
    string materialStoreID=4;
	//后续任务 
    MaterialStoreInfo materialStore=5;
	//生产工单号ID 
 	string productOrderID=6;
	//事务状态 
    ProductOrderInfo productOrder=7;
	//申请时间 
    string createTime=8;
	//申请人员ID 
 	string createUserID=9;
 	string createUserName=14;
	//当前状态 
    string currentState=10;
	//事务状态
    string transactionState=11;
	//状态变更时间 
    string lastUpdateTime=12;
	//备注
 	string remark=13;
	//行项目
	repeated WMSBillItemInfo wMSBillItems=15;
}

// 拣货单行项目
message WMSBillItemInfo {
	//ID
	string id=1;
	//拣货单ID
	string wMSBillQueueID=2;
	//工单BOM行ID
	string productOrderBomID=3;
	//物料ID
	string materialInfoID=4;
	//物料号
	string materialNo=5;
	//物料描述
	string materialDescription=6;
	//仓库ID
	string materialStoreID=7;
	//仓库代号
	string materialStoreCode=8;
	//需求数量
	int64 requiredQTY=9;
	//锁定数量
	int64 lockedQTY=10;
	//当前状态（待拣货/已完成/已取消）
	string currentState=11;
	//备注
	string remark=12;
}

message QueryWMSBillQueueRequest{
    // @inject_tag: uri:"pageIndex" form:"pageIndex"
    int64 pageIndex=1;
    // @inject_tag: uri:"pageSize" form:"pageSize"
    int64 pageSize=2;
    // @inject_tag: uri:"sortConfig" form:"sortConfig"
    string sortConfig=3;
    // 创建时间开始 
	// @inject_tag: uri:"createTime0" form:"createTime0"
    string createTime0=4;
	// 创建时间结束 
	// @inject_tag: uri:"createTime1" form:"createTime1"
    string createTime1=5;
	// 物料仓库信息 
	// @inject_tag: uri:"materialStore" form:"materialStore"
    string materialStore=6;
}

message QueryWMSBillQueueResponse{
    Code code=1;
    string message=2;
    repeated WMSBillQueueInfo data=3;
    int64 pages=4;
    int64 records=5;
    int64 total=6;
}

message GetAllWMSBillQueueResponse{
    Code code=1;
    string message=2;
    repeated WMSBillQueueInfo data=3;
}

message GetWMSBillQueueDetailResponse{
    Code code=1;
    string message=2;
    WMSBillQueueInfo data=3;
}