name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./pkg/... -count=1

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      # umi 生成的 Layout.tsx 含本机绝对路径的 /// <reference types>，
      # CI 环境下无法解析且 @ts-nocheck 不能抑制该解析错误，剔除后再检查
      - name: Strip absolute-path type reference in generated layout
        run: sed -i '/reference types=.*pro-components/d' src/.umi/plugin-layout/Layout.tsx

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
